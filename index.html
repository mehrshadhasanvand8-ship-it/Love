<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party - بنفش و دارک آنلاین</title>
    <style>
        :root {
            --bg-main: #09070f;
            --card-bg: #130f26;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid #2e2352;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15);
        }

        h2, h3 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #3b2d6b;
            background: #0f0a21;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .hidden { display: none !important; }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .movie-card {
            background: #0b0718;
            border: 1px solid #2a1f4d;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .movie-card p {
            padding: 8px;
            font-size: 13px;
        }

        .player-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
        }

        video#mainVideo {
            width: 100%;
            max-height: 450px;
            display: block;
        }

        .cam-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .cam-overlay video {
            width: 90px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--accent);
            background: #222;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-tabs button {
            margin: 0;
            background: #1a1336;
        }

        .nav-tabs button.active {
            background: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ورود و ثبت‌نام -->
    <div id="authSection">
        <h2>💜 ورود به Watch Party (Firebase)</h2>
        <input type="text" id="authId" placeholder="آیدی کاربری...">
        <input type="password" id="authPass" placeholder="رمز عبور...">
        <button onclick="login()">ورود</button>
        <button onclick="register()" style="background: transparent; border: 1px solid var(--accent);">ثبت‌نام حساب جدید</button>
    </div>

    <!-- پنل اصلی -->
    <div id="appSection" class="hidden">
        <div class="nav-tabs">
            <button onclick="switchTab('movies')" class="active" id="tabMovies">🎬 بانک فیلم‌ها</button>
            <button onclick="switchTab('friends')" id="tabFriends">👥 دوستان و سرچ</button>
            <button onclick="switchTab('addMovie')" id="tabAdd">➕ افزودن فیلم</button>
        </div>

        <!-- لیست فیلم‌ها -->
        <div id="moviesTab">
            <h3>فیلم‌های آنلاین دیتابیس</h3>
            <div class="movie-grid" id="movieList"></div>
        </div>

        <!-- سرچ و دوستان -->
        <div id="friendsTab" class="hidden">
            <h3>جستجوی آیدی دوست</h3>
            <input type="text" id="searchFriendId" placeholder="آیدی دوست را وارد کنید...">
            <button onclick="addFriend()">افزودن به لیست دوستان</button>
            
            <h3 style="margin-top: 20px;">لیست دوستان</h3>
            <ul id="friendsList" style="list-style: none; padding: 0;"></ul>
        </div>

        <!-- افزودن فیلم -->
        <div id="addMovieTab" class="hidden">
            <h3>ثبت فیلم جدید در سرور آنلاین</h3>
            <input type="text" id="movieTitle" placeholder="نام فیلم...">
            <input type="text" id="movieCover" placeholder="لینک عکس پوستر (URL)...">
            <input type="text" id="movieUrl" placeholder="لینک مستقیم فایل ویدیو (MP4)...">
            <button onclick="saveMovie()">ثبت عمومی فیلم</button>
        </div>

        <!-- پخش‌کننده فیلم و دوربین -->
        <div id="playerTab" class="hidden">
            <h3 id="playingTitle">در حال پخش...</h3>
            <div class="player-container">
                <video id="mainVideo" controls></video>
                
                <div class="cam-overlay">
                    <video id="myCam" autoplay muted></video>
                    <video id="partnerCam" autoplay></video>
                </div>
            </div>
            <button onclick="closePlayer()" style="margin-top: 15px; background: #ef4444;">خروج از پخش</button>
        </div>
    </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const DB_URL = "https://crazyapp-9663a-default-rtdb.firebaseio.com";
    let currentUser = null;
    let peer = null;
    let isRemoteAction = false;
    let currentRoomId = null;

    // توابع REST API برای Firebase
    async function fbGet(path) {
        const res = await fetch(`${DB_URL}/${path}.json`);
        return await res.json();
    }

    async function fbSet(path, data) {
        await fetch(`${DB_URL}/${path}.json`, {
            method: 'PUT',
            body: JSON.stringify(data)
        });
    }

    // ثبت‌نام آنلاین
    async function register() {
        const id = document.getElementById('authId').value.trim();
        const pass = document.getElementById('authPass').value.trim();
        if(!id || !pass) return alert('آیدی و رمز را وارد کنید.');

        const user = await fbGet(`users/${id}`);
        if(user) return alert('این آیدی قبلاً ثبت شده است.');

        await fbSet(`users/${id}`, { pass: pass, friends: {} });
        alert('ثبت‌نام آنلاین با موفقیت انجام شد!');
    }

    // ورود آنلاین
    async function login() {
        const id = document.getElementById('authId').value.trim();
        const pass = document.getElementById('authPass').value.trim();
        const user = await fbGet(`users/${id}`);

        if(user && user.pass === pass) {
            currentUser = id;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            initPeer();
            loadMovies();
            loadFriends();
            listenToWatchRequests();
        } else {
            alert('آیدی یا رمز عبور اشتباه است.');
        }
    }

    function initPeer() {
        peer = new Peer(currentUser);
        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                document.getElementById('myCam').srcObject = stream;
                call.answer(stream);
                call.on('stream', (remoteStream) => {
                    document.getElementById('partnerCam').srcObject = remoteStream;
                });
            });
        });
    }

    function switchTab(tab) {
        document.getElementById('moviesTab').classList.add('hidden');
        document.getElementById('friendsTab').classList.add('hidden');
        document.getElementById('addMovieTab').classList.add('hidden');
        document.getElementById('playerTab').classList.add('hidden');

        if(tab === 'movies') document.getElementById('moviesTab').classList.remove('hidden');
        if(tab === 'friends') document.getElementById('friendsTab').classList.remove('hidden');
        if(tab === 'addMovie') document.getElementById('addMovieTab').classList.remove('hidden');
    }

    // ثبت فیلم آنلاین در دیتابیس
    async function saveMovie() {
        const title = document.getElementById('movieTitle').value;
        const cover = document.getElementById('movieCover').value;
        const url = document.getElementById('movieUrl').value;

        if(!title || !url) return alert('نام و لینک ویدیو الزامی است.');

        const movieId = Date.now();
        await fbSet(`movies/${movieId}`, { title, cover, url });
        
        alert('فیلم در دیتابیس آنلاین ثبت شد!');
        loadMovies();
        switchTab('movies');
    }

    // دریافت آنلاین لیست فیلم‌ها
    async function loadMovies() {
        const list = document.getElementById('movieList');
        list.innerHTML = 'در حال دریافت فیلم‌ها...';
        const movies = await fbGet('movies') || {};
        list.innerHTML = '';

        Object.values(movies).forEach((m) => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img src="${m.cover || 'https://via.placeholder.com/150'}" alt="${m.title}">
                <p>${m.title}</p>
            `;
            card.onclick = () => startWatchingMovie(m.title, m.url);
            list.appendChild(card);
        });
    }

    // افزودن دوست
    async function addFriend() {
        const friendId = document.getElementById('searchFriendId').value.trim();
        if(friendId === currentUser) return alert('نمی‌توانید خودتان را اضافه کنید.');

        const user = await fbGet(`users/${friendId}`);
        if(!user) return alert('کاربری با این آیدی یافت نشد.');

        await fbSet(`users/${currentUser}/friends/${friendId}`, true);
        alert('دوست با موفقیت اضافه شد!');
        loadFriends();
    }

    // بارگذاری لیست دوستان
    async function loadFriends() {
        const list = document.getElementById('friendsList');
        list.innerHTML = '';
        const user = await fbGet(`users/${currentUser}`);
        const friends = user.friends || {};

        Object.keys(friends).forEach(f => {
            const li = document.createElement('li');
            li.style.padding = '10px';
            li.style.borderBottom = '1px solid #221a42';
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.innerHTML = `<span>👤 ${f}</span> <button onclick="requestWatch('${f}')" style="width:auto; padding:5px 10px; margin:0;">درخواست تماشا</button>`;
            list.appendChild(li);
        });
    }

    // ارسال درخواست تماشای فیلم آنلاین
    async function requestWatch(friendId) {
        currentRoomId = `${currentUser}_${friendId}`;
        await fbSet(`requests/${friendId}`, { from: currentUser, roomId: currentRoomId });
        alert(`درخواست تماشا برای ${friendId} ارسال شد. منتظر تایید باشید...`);
    }

    // دریافت درخواست‌های تماشای آنلاین
    function listenToWatchRequests() {
        setInterval(async () => {
            const req = await fbGet(`requests/${currentUser}`);
            if(req) {
                if(confirm(`کاربر ${req.from} درخواست تماشای هم‌زمان فیلم داده است. می‌پذیرید؟`)) {
                    currentRoomId = req.roomId;
                    await fbSet(`requests/${currentUser}`, null);
                    startVideoChat(req.from);
                    syncPlayerEvents();
                }
            }
        }, 3000);
    }

    // شروع هم‌زمانی و ویدیوچت
    function startWatchingMovie(title, url) {
        switchTab('player');
        document.getElementById('playerTab').classList.remove('hidden');
        document.getElementById('playingTitle').innerText = title;

        const video = document.getElementById('mainVideo');
        video.src = url;

        if(!currentRoomId) currentRoomId = `room_${Date.now()}`;
        syncPlayerEvents();
    }

    function startVideoChat(partnerId) {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
            document.getElementById('myCam').srcObject = stream;
            const call = peer.call(partnerId, stream);
            call.on('stream', (remoteStream) => {
                document.getElementById('partnerCam').srcObject = remoteStream;
            });
        });
    }

    // هم‌زمان‌سازی اکشن‌های پخش (Play / Pause / Seek) در دیتابیس
    function syncPlayerEvents() {
        const video = document.getElementById('mainVideo');

        video.onplay = () => {
            if(isRemoteAction) return;
            fbSet(`rooms/${currentRoomId}`, { action: 'play', time: video.currentTime });
        };

        video.onpause = () => {
            if(isRemoteAction) return;
            fbSet(`rooms/${currentRoomId}`, { action: 'pause', time: video.currentTime });
        };

        video.onseeking = () => {
            if(isRemoteAction) return;
            fbSet(`rooms/${currentRoomId}`, { action: 'seek', time: video.currentTime });
        };

        // گوش دادن زنده به تغییرات دیتابیس
        setInterval(async () => {
            if(!currentRoomId) return;
            const state = await fbGet(`rooms/${currentRoomId}`);
            if(state && !isRemoteAction) {
                isRemoteAction = true;
                if(state.action === 'play' && video.paused) {
                    video.currentTime = state.time;
                    video.play();
                } else if(state.action === 'pause' && !video.paused) {
                    video.currentTime = state.time;
                    video.pause();
                } else if(Math.abs(video.currentTime - state.time) > 1.5) {
                    video.currentTime = state.time;
                }
                setTimeout(() => { isRemoteAction = false; }, 500);
            }
        }, 1000);
    }

    function closePlayer() {
        const video = document.getElementById('mainVideo');
        video.pause();
        video.src = '';
        switchTab('movies');
    }
</script>

</body>
</html>
