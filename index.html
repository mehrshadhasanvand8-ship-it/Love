<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE ROOM - Watch Party Pro</title>
    <style>
        :root {
            --bg-main: #09070f;
            --card-bg: #130f26;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-light: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            padding-bottom: 130px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid #2e2352;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15);
        }

        .online-badge {
            background: #10b981;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }

        h2, h3 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 12px;
            font-size: 16px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #3b2d6b;
            background: #0f0a21;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        button {
            background: var(--accent);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--accent-hover); }
        .hidden { display: none !important; }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .nav-tabs button { margin: 0; background: #1a1336; font-size: 12px; padding: 8px; }
        .nav-tabs button.active { background: var(--accent); }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .movie-card {
            background: #0b0718;
            border: 1px solid #2a1f4d;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .movie-card img { width: 100%; height: 140px; object-fit: cover; }
        .movie-card p { padding: 6px; font-size: 12px; }

        .viewer-count {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #10b981;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
        }

        .player-wrapper {
            width: 100%;
            height: 50vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--accent);
        }

        video#mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .chat-box {
            background: #0b0718;
            border: 1px solid #2a1f4d;
            border-radius: 12px;
            padding: 10px;
            height: 140px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-msg {
            background: #181135;
            padding: 5px 8px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 11px;
        }

        .chat-msg.me { align-self: flex-end; background: var(--accent); }
        .chat-msg span { font-size: 8px; opacity: 0.7; display: block; }

        .chat-input-group { display: flex; gap: 6px; margin-top: 6px; }
        .chat-input-group input { margin: 0; }
        .chat-input-group button { width: auto; padding: 0 12px; margin: 0; }

        .bottom-cams-container {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 9999;
        }

        .cam-box {
            width: 90px;
            height: 120px;
            background: #000;
            border: 2px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            position: relative;
            pointer-events: auto;
        }

        .cam-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cam-label {
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            font-size: 9px;
            text-align: center;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="authSection">
        <h2>💜 ورود به LOVE ROOM</h2>
        <input type="text" id="authId" placeholder="آیدی کاربری...">
        <input type="password" id="authPass" placeholder="رمز عبور...">
        <button onclick="login()">ورود</button>
        <button onclick="register()" style="background: transparent; border: 1px solid var(--accent);">ثبت‌نام جدید</button>
    </div>

    <div id="appSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="online-badge">🟢 کاربران آنلاین: <span id="totalOnlineCount">0</span> نفر</div>
            <div id="userInfo" style="font-size: 12px; opacity: 0.8;"></div>
        </div>

        <div class="nav-tabs">
            <button onclick="switchTab('movies')" class="active" id="tabMovies">🎬 بانک فیلم‌ها</button>
            <button onclick="switchTab('friends')" id="tabFriends">👥 دوستان و سرچ</button>
            <button onclick="switchTab('addMovie')" id="tabAdd">➕ افزودن فیلم</button>
        </div>

        <div id="moviesTab">
            <h3>فیلم‌های موجود</h3>
            <div class="movie-grid" id="movieList"></div>
        </div>

        <div id="friendsTab" class="hidden">
            <h3>جستجوی آیدی دوست</h3>
            <input type="text" id="searchFriendId" placeholder="آیدی دوست...">
            <button onclick="addFriend()">افزودن به دوستان</button>
            <h3 style="margin-top: 15px;">لیست دوستان</h3>
            <ul id="friendsList" style="list-style: none;"></ul>
        </div>

        <div id="addMovieTab" class="hidden">
            <h3>ثبت فیلم جدید</h3>
            <input type="text" id="movieTitle" placeholder="نام فیلم...">
            <input type="text" id="movieCover" placeholder="لینک پوستر...">
            <input type="text" id="movieUrl" placeholder="لینک مستقیم ویدیو...">
            <button onclick="saveMovie()">ثبت فیلم</button>
        </div>

        <div id="playerTab" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 id="playingTitle" style="margin:0;">در حال پخش...</h3>
                <span style="font-size: 12px; color: #10b981;">👥 بینندگان این فیلم: <strong id="movieViewerCount">1</strong> نفر</span>
            </div>
            
            <div class="player-wrapper">
                <video id="mainVideo" controls></video>
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <button id="camToggleBtn" onclick="toggleCamera()" style="background: #10b981; margin: 0;">📹 روشن کردن دوربین و صدا</button>
                <button onclick="closePlayer()" style="background: #ef4444; margin: 0;">خروج</button>
            </div>

            <div class="chat-box">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-group">
                    <input type="text" id="msgInput" placeholder="پیامی بنویسید..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">ارسال</button>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="bottomCams" class="bottom-cams-container hidden">
    <div class="cam-box">
        <video id="myCam" autoplay muted playsinline></video>
        <div class="cam-label">شما</div>
    </div>

    <div class="cam-box">
        <video id="partnerCam" autoplay playsinline></video>
        <div class="cam-label" id="partnerLabel">پارتنر (در انتظار)</div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const DB_URL = "https://crazyapp-9663a-default-rtdb.firebaseio.com";
    let currentUser = null;
    let isRemoteAction = false;
    let currentRoomId = null;
    let currentMovieId = null;
    let lastMsgCount = 0;
    let peer = null;
    let localStream = null;
    let activeCall = null;
    let partnerId = null;

    async function fbGet(path) {
        try { const res = await fetch(`${DB_URL}/${path}.json`); return await res.json(); } catch(e) { return null; }
    }

    async function fbSet(path, data) {
        await fetch(`${DB_URL}/${path}.json`, { method: 'PUT', body: JSON.stringify(data) });
    }

    async function fbPush(path, data) {
        await fetch(`${DB_URL}/${path}.json`, { method: 'POST', body: JSON.stringify(data) });
    }

    async function register() {
        const id = document.getElementById('authId').value.trim();
        const pass = document.getElementById('authPass').value.trim();
        if(!id || !pass) return alert('آیدی و رمز را وارد کنید.');
        const user = await fbGet(`users/${id}`);
        if(user) return alert('این آیدی قبلاً ثبت شده است.');
        await fbSet(`users/${id}`, { pass: pass, friends: {} });
        alert('ثبت‌نام انجام شد!');
    }

    async function login() {
        const id = document.getElementById('authId').value.trim();
        const pass = document.getElementById('authPass').value.trim();
        const user = await fbGet(`users/${id}`);

        if(user && user.pass === pass) {
            currentUser = id;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('userInfo').innerText = `👤 ${currentUser}`;
            
            initPeer();
            startPresence();
            loadMovies();
            loadFriends();
            listenToWatchRequests();
        } else {
            alert('اطلاعات ورود اشتباه است.');
        }
    }

    /* پینگ آنلاین بودن کاربران */
    function startPresence() {
        setInterval(async () => {
            if(currentUser) {
                await fbSet(`online/${currentUser}`, Date.now());
                updateOnlineStatus();
            }
        }, 3000);
    }

    async function updateOnlineStatus() {
        const onlineUsers = await fbGet('online') || {};
        const now = Date.now();
        let count = 0;
        Object.values(onlineUsers).forEach(time => {
            if(now - time < 8000) count++;
        });
        document.getElementById('totalOnlineCount').innerText = count;
    }

    function initPeer() {
        peer = new Peer(currentUser);

        peer.on('call', (call) => {
            activeCall = call;
            if (localStream) {
                call.answer(localStream);
            } else {
                call.answer();
            }
            call.on('stream', (remoteStream) => {
                const partnerVid = document.getElementById('partnerCam');
                partnerVid.srcObject = remoteStream;
                partnerVid.play();
            });
        });
    }

    async function toggleCamera() {
        const btn = document.getElementById('camToggleBtn');

        if(localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
            document.getElementById('myCam').srcObject = null;
            btn.innerText = '📹 روشن کردن دوربین و صدا';
            btn.style.background = '#10b981';
            return;
        }

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('myCam').srcObject = localStream;
            btn.innerText = '🎥 خاموش کردن دوربین و صدا';
            btn.style.background = '#f59e0b';

            if(partnerId && peer) {
                activeCall = peer.call(partnerId, localStream);
                activeCall.on('stream', (remoteStream) => {
                    const partnerVid = document.getElementById('partnerCam');
                    partnerVid.srcObject = remoteStream;
                    partnerVid.play();
                });
            }
        } catch(e) {
            alert('دسترسی به دوربین و میکروفون تأیید نشد.');
        }
    }

    function switchTab(tab) {
        document.getElementById('moviesTab').classList.add('hidden');
        document.getElementById('friendsTab').classList.add('hidden');
        document.getElementById('addMovieTab').classList.add('hidden');
        document.getElementById('playerTab').classList.add('hidden');
        document.getElementById('bottomCams').classList.add('hidden');

        document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));

        if(tab === 'movies') { document.getElementById('moviesTab').classList.remove('hidden'); document.getElementById('tabMovies').classList.add('active'); loadMovies(); }
        if(tab === 'friends') { document.getElementById('friendsTab').classList.remove('hidden'); document.getElementById('tabFriends').classList.add('active'); }
        if(tab === 'addMovie') { document.getElementById('addMovieTab').classList.remove('hidden'); document.getElementById('tabAdd').classList.add('active'); }
    }

    async function saveMovie() {
        const title = document.getElementById('movieTitle').value;
        const cover = document.getElementById('movieCover').value;
        const url = document.getElementById('movieUrl').value;
        if(!title || !url) return alert('اطلاعات ناقص است.');
        const id = 'movie_' + Date.now();
        await fbSet(`movies/${id}`, { id, title, cover, url });
        alert('فیلم ذخیره شد.');
        switchTab('movies');
    }

    async function loadMovies() {
        const list = document.getElementById('movieList');
        list.innerHTML = 'در حال دریافت...';
        const movies = await fbGet('movies') || {};
        const movieViewers = await fbGet('movie_viewers') || {};
        list.innerHTML = '';

        Object.values(movies).forEach((m) => {
            const viewers = movieViewers[m.id] ? Object.keys(movieViewers[m.id]).length : 0;
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <span class="viewer-count">👁️ ${viewers}</span>
                <img src="${m.cover || 'https://via.placeholder.com/150'}">
                <p>${m.title}</p>
            `;
            card.onclick = () => startWatchingMovie(m);
            list.appendChild(card);
        });
    }

    async function addFriend() {
        const friendId = document.getElementById('searchFriendId').value.trim();
        if(!friendId || friendId === currentUser) return;
        const user = await fbGet(`users/${friendId}`);
        if(!user) return alert('کاربر پیدا نشد.');
        await fbSet(`users/${currentUser}/friends/${friendId}`, true);
        alert('دوست اضافه شد!');
        loadFriends();
    }

    async function loadFriends() {
        const list = document.getElementById('friendsList');
        list.innerHTML = '';
        const user = await fbGet(`users/${currentUser}`);
        const friends = user.friends || {};
        Object.keys(friends).forEach(f => {
            const li = document.createElement('li');
            li.style.cssText = 'padding:8px 0; border-bottom:1px solid #221a42; display:flex; justify-content:space-between; align-items:center;';
            li.innerHTML = `<span>👤 ${f}</span> <button onclick="requestWatch('${f}')" style="width:auto; padding:4px 8px; margin:0;">دعوت به تماشا</button>`;
            list.appendChild(li);
        });
    }

    async function requestWatch(fId) {
        currentRoomId = [currentUser, fId].sort().join('_');
        await fbSet(`requests/${fId}`, { from: currentUser, roomId: currentRoomId });
        alert(`دعوت‌نامه برای ${fId} ارسال شد.`);
    }

    function listenToWatchRequests() {
        setInterval(async () => {
            const req = await fbGet(`requests/${currentUser}`);
            if(req) {
                if(confirm(`کاربر ${req.from} شما را به تماشای فیلم دعوت کرده است. قبول می‌کنید؟`)) {
                    currentRoomId = req.roomId;
                    partnerId = req.from;
                    await fbSet(`requests/${currentUser}`, null);
                    openPlayerUI(req.from);
                }
            }
        }, 3000);
    }

    /* الگوریتم گروه‌بندی ۲ به ۲ هوشمند و تصادفی */
    async function startWatchingMovie(movie) {
        currentMovieId = movie.id;
        await fbSet(`movie_viewers/${currentMovieId}/${currentUser}`, true);

        // یافتن افراد منتظر برای این فیلم
        const viewers = await fbGet(`movie_viewers/${currentMovieId}`) || {};
        const viewerIds = Object.keys(viewers).filter(id => id !== currentUser);

        if(viewerIds.length > 0) {
            // انتخاب یک نفر شانسى از بین افراد موجود
            partnerId = viewerIds[Math.floor(Math.random() * viewerIds.length)];
            currentRoomId = [currentUser, partnerId].sort().join('_');
        } else {
            partnerId = null;
            currentRoomId = `room_${currentMovieId}_${currentUser}`;
        }

        openPlayerUI(partnerId || 'در انتظار هم‌اتاقی...');
        document.getElementById('mainVideo').src = movie.url;
        document.getElementById('playingTitle').innerText = movie.title;
    }

    function openPlayerUI(pLabel) {
        switchTab('player');
        document.getElementById('playerTab').classList.remove('hidden');
        document.getElementById('bottomCams').classList.remove('hidden');
        document.getElementById('partnerLabel').innerText = pLabel;
        syncPlayerAndChat();
    }

    async function sendChat() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text || !currentRoomId) return;

        await fbPush(`rooms/${currentRoomId}/messages`, {
            sender: currentUser,
            text: text,
            time: new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })
        });
        input.value = '';
    }

    function syncPlayerAndChat() {
        const video = document.getElementById('mainVideo');

        video.onplay = () => { if(!isRemoteAction) fbSet(`rooms/${currentRoomId}/sync`, { action: 'play', time: video.currentTime }); };
        video.onpause = () => { if(!isRemoteAction) fbSet(`rooms/${currentRoomId}/sync`, { action: 'pause', time: video.currentTime }); };
        video.onseeking = () => { if(!isRemoteAction) fbSet(`rooms/${currentRoomId}/sync`, { action: 'seek', time: video.currentTime }); };

        setInterval(async () => {
            if(!currentRoomId) return;

            // به‌روزرسانی تعداد بینندگان فیلم جاری
            if(currentMovieId) {
                const viewers = await fbGet(`movie_viewers/${currentMovieId}`) || {};
                document.getElementById('movieViewerCount').innerText = Object.keys(viewers).length;
            }

            // سینک چت
            const msgs = await fbGet(`rooms/${currentRoomId}/messages`);
            if(msgs) {
                const msgList = Object.values(msgs);
                if(msgList.length !== lastMsgCount) {
                    lastMsgCount = msgList.length;
                    const container = document.getElementById('chatMessages');
                    container.innerHTML = '';
                    msgList.forEach(m => {
                        const div = document.createElement('div');
                        div.className = `chat-msg ${m.sender === currentUser ? 'me' : ''}`;
                        div.innerHTML = `<span>${m.sender} - ${m.time}</span>${m.text}`;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            }

            // سینک ویدیو
            const sync = await fbGet(`rooms/${currentRoomId}/sync`);
            if(sync && !isRemoteAction) {
                isRemoteAction = true;
                if(sync.action === 'play' && video.paused) { video.currentTime = sync.time; video.play(); }
                else if(sync.action === 'pause' && !video.paused) { video.currentTime = sync.time; video.pause(); }
                else if(Math.abs(video.currentTime - sync.time) > 1.5) { video.currentTime = sync.time; }
                setTimeout(() => { isRemoteAction = false; }, 400);
            }
        }, 1200);
    }

    async function closePlayer() {
        const video = document.getElementById('mainVideo');
        video.pause();
        video.src = '';
        if(localStream) toggleCamera();
        if(currentMovieId && currentUser) {
            await fbSet(`movie_viewers/${currentMovieId}/${currentUser}`, null);
        }
        currentRoomId = null;
        currentMovieId = null;
        partnerId = null;
        lastMsgCount = 0;
        switchTab('movies');
    }
</script>

</body>
</html>
